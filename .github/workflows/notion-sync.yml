# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Push Markdown to Notion

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read # Read access to the repository contents is required to read the Markdown files.
  actions: write # required for `workflow-dispatch` to trigger the automerge workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_markdown_job:
    runs-on: ubuntu-latest
    name: Push Markdown to Notion
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Push Markdown to Notion
        env:
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
        if: env.NOTION_ACCESS_TOKEN != null
        uses: step-security/push-md-to-notion@d85b726c0b1f4c05624cacdc959e48f381ea0989 # v1.1.0
        with:
          notion-token: ${{ secrets.NOTION_ACCESS_TOKEN }}
          dry-run: ${{ format('refs/heads/{0}', github.event.repository.default_branch) != github.ref }}

      - name: Automerge
        if: format('refs/heads/{0}', github.event.repository.default_branch) != github.ref
        uses: ./.github/actions/trigger-automerge
        with:
          event: ${{ toJSON(github.event) }}
          hasAutoApproverPrivateKey: ${{ secrets.AUTO_APPROVER_PRIVATE_KEY != '' }}


  otel_cicd_export:
    name: OpenTelemetry Export Trace
    if: always()
    needs: [push_markdown_job]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Export workflow trace
        uses: step-security/otel-cicd-action@867b2182ace9682deea2e7c31712596e02e72644 # v4.0.1
        continue-on-error: true
        with:
          otlpEndpoint: grpc://api.honeycomb.io:443/
          otlpHeaders: "x-honeycomb-team=${{ secrets.HONEYCOMB_GHA_SECRET }},x-honeycomb-dataset=${{ vars.HONEYCOMB_GHA_DATASET }}"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
