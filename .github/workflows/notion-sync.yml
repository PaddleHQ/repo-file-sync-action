# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Push Markdown to Notion

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches:
      - main
      - master
    paths:
      - '**.md'

permissions:
  contents: read # Read access to the repository contents is required to read the Markdown files.
  actions: write # required for `workflow-dispatch` to trigger the automerge workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_markdown_job:
    runs-on: generic-2-core
    timeout-minutes: 10
    name: Push Markdown to Notion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Push Markdown to Notion
        env:
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
        if: env.NOTION_ACCESS_TOKEN != null
        uses: step-security/push-md-to-notion@cc265a1476543fe222e498e7dedd05f724a4577d # v1.2.1
        with:
          notion-token: ${{ secrets.NOTION_ACCESS_TOKEN }}
          dry-run: ${{ format('refs/heads/{0}', github.event.repository.default_branch) != github.ref }}

      - name: Automerge
        if: format('refs/heads/{0}', github.event.repository.default_branch) != github.ref
        uses: ./.github/actions/trigger-automerge
        with:
          event: ${{ toJSON(github.event) }}
          hasAutoApproverPrivateKey: ${{ secrets.AUTO_APPROVER_PRIVATE_KEY != '' }}


  otel_cicd_export:
    name: OpenTelemetry Export Trace
    if: always()
    needs: [push_markdown_job]
    runs-on: generic-2-core
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout otel-export action
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/otel-export
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Export workflow trace
        if: always()
        uses: ./.github/actions/otel-export
        continue-on-error: true
        with:
          honeycomb-team: ${{ secrets.HONEYCOMB_GHA_SECRET }}
          honeycomb-dataset: ${{ vars.HONEYCOMB_GHA_DATASET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
